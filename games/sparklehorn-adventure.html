<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sparklehorn Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #1e293b;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    font-family: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
    color: #3b1d6e; overscroll-behavior: none;
  }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(circle at 50% 35%, #a7f3d0 0%, #6ee7b7 35%, #8b5cf6 100%);
    touch-action: none; transition: opacity .3s ease, visibility .3s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .logo { font-size: clamp(34px, 8vmin, 72px); font-weight: 700; color: #fff; text-align: center; line-height: 1;
    text-shadow: 0 4px 0 #6d28d9, 0 8px 24px rgba(0,0,0,.25); }
  .logo small { display: block; font-size: .45em; color: #fef3c7; margin-top: .3em; }
  .hero { font-size: clamp(64px, 18vmin, 150px); line-height: 1; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } }
  .big {
    font: inherit; font-weight: 700; border: none; border-radius: 999px; cursor: pointer;
    background: #fff; color: #6d28d9; box-shadow: 0 6px 0 #6d28d9, 0 10px 24px rgba(0,0,0,.2);
    font-size: clamp(26px, 6vmin, 44px); padding: .35em 1.2em; min-width: 140px; min-height: 72px;
    touch-action: manipulation;
  }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #6d28d9; }
  .row { display: flex; gap: 4vmin; flex-wrap: wrap; justify-content: center; }
  .pick { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: .3em .9em; }
  .pick .e { font-size: 1.6em; line-height: 1.1; }
  .pick .l { font-size: .55em; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="overlay" id="title">
  <div class="logo">Sparklehorn<small>Adventure</small></div>
  <div class="hero" aria-hidden="true">🦄</div>
  <button class="big" id="play" type="button" aria-label="Play">▶</button>
</div>

<div class="overlay hidden" id="diff">
  <div class="row">
    <button class="big pick" id="easy" type="button" aria-label="Easy"><span class="e">🐣</span><span class="l">Easy</span></button>
    <button class="big pick" id="normal" type="button" aria-label="Normal"><span class="e">🦄</span><span class="l">Normal</span></button>
  </div>
</div>

<div class="overlay hidden" id="welcome">
  <div class="hero" aria-hidden="true">🦄✨</div>
  <div class="logo" style="font-size:clamp(26px,6vmin,48px)">Welcome back!</div>
  <button class="big" id="resume" type="button" aria-label="Keep playing">▶</button>
</div>

<!-- Pure game logic: no DOM. Unit-tested by tests/sparklehorn.test.mjs. -->
<script id="spk-core">
(function (G) {
  'use strict';
  var SPK = {};
  SPK.TILE = 32;

  SPK.DIFF = {
    easy:   { hp: 12, autoMagic: true,  autoMagicEvery: 0.5, enemySpeed: 0.7, enemyAtk: 0.7, maxHit: 1, hintAfter: 45,   beetleMagicFull: true },
    normal: { hp: 8,  autoMagic: false, autoMagicEvery: 0.5, enemySpeed: 1,   enemyAtk: 1,   maxHit: 2, hintAfter: null, beetleMagicFull: false },
  };

  // ── World maps (one character = one tile) ─────────────────────────
  // . grass  , flowers  : path  T tree  ~ water  # rock  B cracked boulder
  // D cave door  U cave exit  F campfire  C chest  H heart piece  S slimes
  // M mushrooms  P power pedestal  @ start  = cave floor
  SPK.MAPS = {
    meadow: { name: 'Sunny Meadow', floor: '.', rows: [
      'TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT',
      'TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT',
      'T...............,.#############.....,....,....TT',
      'TT.H..............#############..,.............T',
      'TT.........,..TT..#############,.,..........C.TT',
      'TT...,TT.,.,,.......####D####.....TT.....,....TT',
      'TT,...T......,......,...:.,........T...........T',
      'TT......................:,.............,.TT...TT',
      'T..,....C...............:.........S............T',
      'T.......................:.,...............,...TT',
      'T.....M,................:T...........,F...,...TT',
      'T...........:::::::::::::.....,....,..........TT',
      'TT..........:.......C.........M...,...,...S...TT',
      'TT......,.TT:...............,....H.,........,..T',
      'TT..........:....,.........,.........,.........T',
      'T..TT.......:.....S........T..........TT......TT',
      'T..,.,......:..,.................,..........C.TT',
      'TT..........:.....,......,......,.............TT',
      'T...........F.....,.........C......~~~........TT',
      'TT.........,:...,..........,,...~~~~~~~~~......T',
      'TT,.........@..................~~~~~~~~~~~....TT',
      'T..............,.......,,,.....~~~~~~~~~~~.....T',
      'TT...............TT..,.........~~~~~~~~~~~..T..T',
      'T........S......,.T.............~~~~~~~~~..,...T',
      'T......,..,,..............S.....,..~~~........TT',
      'T.TTTTTT...............,......................TT',
      'TTT....T....TT.,........,.....F.....,....S.....T',
      'TTT....B......,........................,.,...,TT',
      'TTT.C..T..,......,....TT.........T......C......T',
      'T.T....T........C..........,.,.............,.H.T',
      'T.TTTTTT...........,......,..................,TT',
      'TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT',
    ] },
    pebble: { name: 'Pebble Cave', floor: '=', cave: true, rows: [
      '##############################',
      '##############################',
      '#####=====##=====###=====#####',
      '#####=C===##==M==###==C==#####',
      '#####=====##=====###=====#####',
      '#####=====##=============#####',
      '#####=====##=============#####',
      '#####=====##=====###=====#####',
      '#=========##=====###=========#',
      '#============S===#######=====#',
      '#U===F===============###=====#',
      '#=========####=======###===P=#',
      '#=========####====M==###=====#',
      '##############=======###=====#',
      '##############===============#',
      '##############===========S===#',
      '##############=C=============#',
      '##############=======#########',
      '##############################',
      '##############################',
    ] },
  };

  SPK.LEGEND = '.,:T~#BDUFCHSMP@=';
  var SOLID = { T: 1, '~': 1, '#': 1, B: 1 };
  var ENTITY = { B: 1, D: 1, U: 1, F: 1, C: 1, H: 1, S: 1, M: 1, P: 1, '@': 1 };
  var mapCache = {};

  SPK.parseMap = function (id) {
    if (mapCache[id] && mapCache[id].src === SPK.MAPS[id]) return mapCache[id].map;
    var src = SPK.MAPS[id];
    if (!src) throw new Error('unknown map: ' + id);
    var rows = src.rows, h = rows.length, w = rows[0].length;
    var tiles = new Uint8Array(w * h), entities = [];
    for (var y = 0; y < h; y++) {
      if (rows[y].length !== w) throw new Error('map ' + id + ' row ' + y + ' has the wrong width');
      for (var x = 0; x < w; x++) {
        var ch = rows[y][x], code = SPK.LEGEND.indexOf(ch);
        if (code < 0) throw new Error('map ' + id + ' has unknown tile ' + ch);
        tiles[y * w + x] = code;
        if (ENTITY[ch]) entities.push({ id: id + ':' + ch + ':' + x + ',' + y, kind: ch, tx: x, ty: y });
      }
    }
    var map = { id: id, w: w, h: h, tiles: tiles, entities: entities, name: src.name, cave: !!src.cave, floor: src.floor || '.' };
    mapCache[id] = { src: src, map: map };
    return map;
  };

  SPK.tileAt = function (map, tx, ty) {
    if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return '#';
    return SPK.LEGEND[map.tiles[ty * map.w + tx]];
  };

  function has(list, v) { return !!list && (typeof list.has === 'function' ? list.has(v) : list.indexOf(v) >= 0); }

  // ctx = { broken: [ids] | Set, powers }
  SPK.isSolid = function (map, tx, ty, ctx) {
    if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return true;
    var ch = SPK.LEGEND[map.tiles[ty * map.w + tx]];
    if (!SOLID[ch]) return false;
    if (ch === 'B') return !has(ctx && ctx.broken, map.id + ':B:' + tx + ',' + ty);
    if (ch === '~' && ctx && ctx.powers && ctx.powers.bubble) return false;
    return true;
  };

  // Moves a body (square of half-size r) by dx,dy, resolving each axis on its
  // own so it slides along walls. Returns the new position and tiles hit.
  SPK.moveAndSlide = function (map, body, dx, dy, ctx) {
    var T = SPK.TILE, r = body.r, x = body.x, y = body.y, hit = [];
    function blocked(px, py) {
      var x0 = Math.floor((px - r) / T), x1 = Math.floor((px + r - 1e-6) / T);
      var y0 = Math.floor((py - r) / T), y1 = Math.floor((py + r - 1e-6) / T);
      var found = null;
      for (var ty = y0; ty <= y1; ty++) for (var tx = x0; tx <= x1; tx++) {
        if (SPK.isSolid(map, tx, ty, ctx)) { found = found || []; found.push({ tx: tx, ty: ty, code: SPK.tileAt(map, tx, ty) }); }
      }
      return found;
    }
    if (dx) {
      var nx = x + dx, b = blocked(nx, y);
      if (b) {
        hit = hit.concat(b);
        nx = dx > 0 ? Math.floor((nx + r) / T) * T - r : (Math.floor((nx - r) / T) + 1) * T + r;
        if (dx > 0 ? nx < x : nx > x) nx = x;
      }
      x = nx;
    }
    if (dy) {
      var ny = y + dy, b2 = blocked(x, ny);
      if (b2) {
        hit = hit.concat(b2);
        ny = dy > 0 ? Math.floor((ny + r) / T) * T - r : (Math.floor((ny - r) / T) + 1) * T + r;
        if (dy > 0 ? ny < y : ny > y) ny = y;
      }
      y = ny;
    }
    return { x: x, y: y, hit: hit };
  };

  SPK.DOORS = {
    'meadow:D:24,5': { to: 'pebble', at: 'pebble:U:1,10' },
    'pebble:U:1,10': { to: 'meadow', at: 'meadow:D:24,5' },
  };

  SPK.entity = function (id) {
    var mapId = id.split(':')[0];
    var m = SPK.parseMap(mapId);
    for (var i = 0; i < m.entities.length; i++) if (m.entities[i].id === id) return m.entities[i];
    return null;
  };

  // Where you stand after coming through a door: the first open tile next to it.
  SPK.doorArrival = function (doorId) {
    var e = SPK.entity(doorId), m = SPK.parseMap(doorId.split(':')[0]);
    var dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];
    var open = function (tx, ty) { var ch = SPK.tileAt(m, tx, ty); return !SPK.isSolid(m, tx, ty, null) && ch !== 'D' && ch !== 'U'; };
    var fallback = null;
    // Prefer stepping straight out of the door: open in front, wall behind.
    for (var i = 0; i < dirs.length; i++) {
      var tx = e.tx + dirs[i][0], ty = e.ty + dirs[i][1];
      if (!open(tx, ty)) continue;
      if (SPK.isSolid(m, e.tx - dirs[i][0], e.ty - dirs[i][1], null)) return { map: m.id, tx: tx, ty: ty };
      fallback = fallback || { map: m.id, tx: tx, ty: ty };
    }
    return fallback || { map: m.id, tx: e.tx, ty: e.ty };
  };

  SPK.HOME_FIRE = 'meadow:F:12,18';

  // ── Combat ───────────────────────────────────────────────────────────
  // speed/sense in tiles(/s); touch and dmg in half-hearts.
  SPK.ENEMIES = {
    slime:     { hp: 2, speed: 1.2, sense: 5, touch: 1 },
    slimeBig:  { hp: 4, speed: 1.0, sense: 5, touch: 1, splitInto: 'slimeMini', splitN: 2 },
    slimeMini: { hp: 1, speed: 1.6, sense: 5, touch: 1 },
    mushroom:  { hp: 3, speed: 0.8, sense: 6, touch: 1, spore: { every: 2.2, windup: 0.6, speed: 2.5, dmg: 1 } },
  };

  function angleDiff(a, b) { var d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }
  SPK.angleDiff = angleDiff;

  SPK.pickTarget = function (px, py, facing, enemies, rangePx, coneDeg) {
    var best = null, bestD = Infinity, half = coneDeg * Math.PI / 360;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (!(e.hp > 0)) continue;
      var dx = e.x - px, dy = e.y - py, d = Math.hypot(dx, dy);
      if (d > rangePx || d >= bestD) continue;
      if (d > 1 && Math.abs(angleDiff(Math.atan2(dy, dx), facing)) > half) continue;
      best = e; bestD = d;
    }
    return best;
  };

  SPK.fanAngles = function (base, n, spreadDeg) {
    if (n <= 1) return [base];
    var out = [], step = spreadDeg * Math.PI / 180 / (n - 1), start = base - spreadDeg * Math.PI / 360;
    for (var i = 0; i < n; i++) out.push(start + step * i);
    return out;
  };

  SPK.damageEnemy = function (e, n) {
    e.hp -= n;
    if (e.hp > 0) return { popped: false, spawn: [] };
    var def = SPK.ENEMIES[e.kind], spawn = [];
    if (def && def.splitInto) {
      for (var i = 0; i < def.splitN; i++) {
        var a = (i / def.splitN) * Math.PI * 2;
        spawn.push({ kind: def.splitInto, x: e.x + Math.cos(a) * SPK.TILE * 0.5, y: e.y + Math.sin(a) * SPK.TILE * 0.5 });
      }
    }
    return { popped: true, spawn: spawn };
  };

  // ── Hearts, sleepy wake-up, campfires ────────────────────────────────
  SPK.INVULN_MS = 1200;
  SPK.hurt = function (state, halfHearts, nowMs) {
    if ((state.fx.invulnUntil || 0) > nowMs) return 'immune';
    state.hp = Math.max(0, state.hp - halfHearts);
    state.fx.invulnUntil = nowMs + SPK.INVULN_MS;
    if (state.hp <= 0) { state.mode = 'sleepy'; return 'sleepy'; }
    return 'ok';
  };

  SPK.hpMaxFor = function (state) {
    return SPK.DIFF[state.difficulty].hp + 2 * Math.floor(state.heartPieces.length / 4);
  };

  // The tile you stand on next to a campfire: south if open, else any side.
  SPK.besideFire = function (fireId) {
    var e = SPK.entity(fireId), m = SPK.parseMap(fireId.split(':')[0]);
    var dirs = [[0, 1], [1, 0], [-1, 0], [0, -1]];
    for (var i = 0; i < dirs.length; i++) {
      var tx = e.tx + dirs[i][0], ty = e.ty + dirs[i][1];
      if (!SPK.isSolid(m, tx, ty, null)) return { map: m.id, tx: tx, ty: ty };
    }
    return { map: m.id, tx: e.tx, ty: e.ty };
  };

  // Everything you found stays found: only position and hearts change.
  SPK.wake = function (state) {
    var at = SPK.besideFire(state.wakeCampfire || SPK.HOME_FIRE);
    state.map = at.map;
    state.x = (at.tx + 0.5) * SPK.TILE; state.y = (at.ty + 0.5) * SPK.TILE;
    state.hp = state.hpMax;
    state.fx.invulnUntil = 0;
    state.mode = 'play';
  };

  SPK.lightCampfire = function (state, id) {
    var fresh = state.campfires.indexOf(id) < 0;
    if (fresh) state.campfires.push(id);
    state.wakeCampfire = id;
    state.hp = state.hpMax;
    return fresh;
  };

  // Walking into a cracked boulder with Mighty Horn bonks it open after 0.6s.
  SPK.BONK_SECS = 0.6;
  SPK.bonkTick = function (state, boulderId, dt) {
    var b = state.fx.bonk || (state.fx.bonk = { id: null, t: 0 });
    if (!boulderId || !state.powers.mighty) { b.id = null; b.t = 0; return false; }
    if (b.id !== boulderId) { b.id = boulderId; b.t = 0; }
    b.t += dt;
    if (b.t >= SPK.BONK_SECS - 1e-9) { b.id = null; b.t = 0; return true; }
    return false;
  };

  // ── Short-term power-ups ─────────────────────────────────────────────
  SPK.POWERUPS = {
    starBurst: { secs: 15, icon: '🌟' },
    swirl: { secs: 30, orbs: 6, radius: 1.4, spin: 2.4, icon: '🔮' }, // radius in tiles, spin rad/s
  };
  SPK.grantPowerup = function (state, kind, nowMs) {
    var def = SPK.POWERUPS[kind];
    if (!def) throw new Error('unknown power-up: ' + kind);
    state.fx[kind] = { until: nowMs + def.secs * 1000, since: nowMs };
    if (def.orbs) state.fx[kind].orbs = def.orbs;
  };
  SPK.activePowerups = function (state, nowMs) {
    var out = [];
    for (var k in SPK.POWERUPS) {
      var f = state.fx[k];
      if (!f || f.until <= nowMs) continue;
      if (SPK.POWERUPS[k].orbs && !(f.orbs > 0)) continue;
      out.push(k);
    }
    return out;
  };
  SPK.hasPowerup = function (state, kind, nowMs) { return SPK.activePowerups(state, nowMs).indexOf(kind) >= 0; };
  SPK.swirlOrbPositions = function (state, nowMs) {
    var f = state.fx.swirl, def = SPK.POWERUPS.swirl, out = [];
    if (!f || f.until <= nowMs || !(f.orbs > 0)) return out;
    var base = (nowMs / 1000) * def.spin, r = def.radius * SPK.TILE;
    for (var i = 0; i < f.orbs; i++) {
      var a = base + (i / f.orbs) * Math.PI * 2;
      out.push({ x: state.x + Math.cos(a) * r, y: state.y + Math.sin(a) * r, i: i });
    }
    return out;
  };
  SPK.swirlHit = function (state) {
    var f = state.fx.swirl;
    if (f && f.orbs > 0) f.orbs--;
  };
  // Angles of the bolts one Magic press fires.
  SPK.fireMagic = function (state, aim, nowMs) {
    return SPK.fanAngles(aim, SPK.hasPowerup(state, 'starBurst', nowMs) ? 5 : 1, 50);
  };

  // ── Chests, heart pieces ─────────────────────────────────────────────
  SPK.CHESTS = {
    'meadow:C:4,28':  { gems: 15 },             // behind the cracked boulder
    'meadow:C:44,4':  { gems: 6 },
    'meadow:C:40,28': { heartPiece: 'meadow:C:40,28' },
    'meadow:C:20,12': { powerup: 'starBurst' },
    'meadow:C:8,8':   { gems: 4 },
    'meadow:C:44,16': { gems: 5 },
    'meadow:C:28,18': { gems: 3 },
    'meadow:C:16,29': { gems: 5 },
    'pebble:C:6,3':   { gems: 8 },
    'pebble:C:15,16': { powerup: 'swirl' },
    'pebble:C:22,3':  { gems: 10 },
  };

  SPK.collectHeartPiece = function (state, id) {
    if (state.heartPieces.indexOf(id) >= 0) return false;
    state.heartPieces.push(id);
    var before = state.hpMax;
    state.hpMax = SPK.hpMaxFor(state);
    if (state.hpMax > before) state.hp = Math.min(state.hpMax, state.hp + (state.hpMax - before));
    return true;
  };

  SPK.openChest = function (state, id) {
    if (state.chests.indexOf(id) >= 0) return null;
    var c = SPK.CHESTS[id];
    if (!c) return null;
    state.chests.push(id);
    if (c.gems) state.gems += c.gems;
    if (c.heartPiece) SPK.collectHeartPiece(state, c.heartPiece);
    return c;
  };

  // ── Where to go next (the hint trail) and what the bunny says ────────
  SPK.BOULDER = 'meadow:B:7,27';
  function goalAt(id) { var e = SPK.entity(id); return { map: id.split(':')[0], tx: e.tx, ty: e.ty }; }
  SPK.nextGoal = function (state) {
    if (!state.powers.mighty) return state.map === 'pebble' ? goalAt('pebble:P:27,11') : goalAt('meadow:D:24,5');
    if (state.broken.indexOf(SPK.BOULDER) < 0) return state.map === 'pebble' ? goalAt('pebble:U:1,10') : goalAt(SPK.BOULDER);
    return null;
  };

  SPK.CRITTER = { map: 'meadow', tx: 14, ty: 18, emoji: '🐰' };
  SPK.critterHint = function (state) {
    if (!state.powers.mighty) return { picture: ['🦄', '➡️', '🕳️', '✨'], text: 'Something magic is in Pebble Cave!' };
    if (state.broken.indexOf(SPK.BOULDER) < 0) return { picture: ['🦄', '💥', '🪨', '🌳'], text: 'Bonk the cracked rock by the trees!' };
    return { picture: ['🦄', '💖', '🗺️'], text: 'You did it! Keep exploring!' };
  };

  SPK.enemyHit = function (state, raw) {
    return Math.max(1, Math.min(raw, SPK.DIFF[state.difficulty].maxHit));
  };

  SPK.createGame = function (difficulty) {
    var d = SPK.DIFF[difficulty];
    if (!d) throw new Error('unknown difficulty: ' + difficulty);
    var start = null, meadow = SPK.parseMap('meadow');
    for (var i = 0; i < meadow.entities.length; i++) if (meadow.entities[i].kind === '@') start = meadow.entities[i];
    return {
      mode: 'intro', difficulty: difficulty, map: 'meadow',
      x: (start.tx + 0.5) * SPK.TILE, y: (start.ty + 0.5) * SPK.TILE, facing: Math.PI / 2,
      hp: d.hp, hpMax: d.hp, gems: 0, powers: {}, chests: [], friends: [], heartPieces: [],
      campfires: [], wakeCampfire: SPK.HOME_FIRE, bossBeaten: false, broken: [], explored: {},

  });
  canvas.addEventListener('pointermove', function (e) { input.move(e.pointerId, e.clientX, e.clientY, now()); });
  canvas.addEventListener('pointerup', function (e) { input.up(e.pointerId, e.clientX, e.clientY, now()); });
  canvas.addEventListener('pointercancel', function (e) { input.cancel(e.pointerId); });

  var horn = { cd: 0, dash: null }, magicCd = 0, autoCd = 0;
  var hitPause = 0, shake = 0, sleepyT = 0, revealT = 0, reveal = null;
  var ACTIVE_R = 14 * TILE, MAX_ACTIVE = 25;

  }

    fires = map.entities.filter(function (e) { return e.kind === 'F'; }).map(function (e) { return { x: (e.tx + 0.5) * TILE, y: (e.ty + 0.5) * TILE }; });
    map.entities.forEach(function (g, gi) {

      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: 0.5 + Math.random() * 0.4, t: 0,

    }
  }
  function popEnemy(e) {

    hitPause = Math.max(hitPause, 0.04); shake = Math.max(shake, 0.12);
    sfx('pop');
    r.spawn.forEach(function (s) { spawnEnemy(s.kind, s.x, s.y, e.group); });
    if (Math.random() < 0.30) for (var i = 0, n = 1 + Math.floor(Math.random() * 3); i < n; i++) dropPickup('gem', e.x, e.y);
    if (Math.random() < 0.12) dropPickup('heart', e.x, e.y);
    else if (Math.random() < 0.10) dropPickup(Math.random() < 0.5 ? 'starBurst' : 'swirl', e.x, e.y);

  }
  function hurtEnemy(e, n) {

    e.hp -= n; e.flash = 0.15;

  function dropPickup(kind, x, y) {

    pickups.push({ kind: kind, x: x, y: y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, z: 0, vz: 120, t: 0 });

  function updateEnemies(dt) {

        for (var i = 0; i < 3; i++) {
          var fx = 5 + hash(x + i, y) * 22, fy = 5 + hash(x, y + i) * 22;
          c.fillStyle = cols[(i + Math.floor(r * 4)) % 4]; c.beginPath(); c.arc(fx, fy, 2.6, 0, 7); c.fill();
          c.fillStyle = '#fef08a'; c.beginPath(); c.arc(fx, fy, 1, 0, 7); c.fill();
        }
        break;
      case ':':
        c.fillStyle = '#ecd9a8'; c.fillRect(-0.5, -0.5, TILE + 1, TILE + 1);
        c.fillStyle = '#dcc590'; c.beginPath(); c.arc(6 + r * 20, 8 + r * 14, 2, 0, 7); c.fill();
        break;
      case 'T':
        ground(c, '.', x, y, cave);
        c.fillStyle = '#8b5a2b'; c.fillRect(13, 18, 6, 12);
        c.fillStyle = r < 0.5 ? '#2f9e44' : '#37a84c'; c.beginPath(); c.arc(16, 13, 13, 0, 7); c.fill();
        c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.arc(11, 9, 5, 0, 7); c.fill();
        break;
      case '~':
        c.fillStyle = '#5aa9f5'; c.fillRect(-0.5, -0.5, TILE + 1, TILE + 1);
        break;
      case '#':
        c.fillStyle = cave ? '#3d3530' : '#a8a29e'; c.fillRect(-0.5, -0.5, TILE + 1, TILE + 1);
        c.strokeStyle = cave ? '#2b2420' : '#8a8480'; c.lineWidth = 2;
        c.strokeRect(1, 1, 14, 14); c.strokeRect(17, 1, 14, 14); c.strokeRect(9, 17, 14, 14);
        break;
      case 'B':
        ground(c, '.', x, y, cave);
        c.fillStyle = '#9ca3af'; c.beginPath(); c.arc(16, 17, 13, 0, 7); c.fill();
        c.strokeStyle = '#4b5563'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(10, 8); c.lineTo(15, 16); c.lineTo(11, 22); c.moveTo(15, 16); c.lineTo(22, 19); c.stroke();
        break;
      case 'D':
        c.fillStyle = '#a8a29e'; c.fillRect(-0.5, -0.5, TILE + 1, TILE + 1);
        c.fillStyle = '#1c1917'; c.beginPath(); c.arc(16, 18, 13, Math.PI, 0); c.lineTo(29, 32); c.lineTo(3, 32); c.fill();
        break;
      case 'U':
        ground(c, '=', x, y, true);
        c.fillStyle = 'rgba(253,230,138,.55)'; c.beginPath(); c.arc(16, 16, 12, 0, 7); c.fill();
        break;
      default:
        ground(c, ch, x, y, cave);
    }
  }
  function floorChar(ch) { return (ch === 'F' || ch === 'C' || ch === 'H' || ch === 'S' || ch === 'M' || ch === 'P' || ch === '@') ? map.floor : ch; }
  function chunkRes() { return Math.min(3, Math.max(1, scale * DPR)); }
  function getChunk(cx, cy) {
    var key = cx + ',' + cy;
    if (chunks[key]) return chunks[key];
    var res = chunkRes(), cv = document.createElement('canvas');
    cv.width = cv.height = Math.ceil(CHUNK * TILE * res);
    var c = cv.getContext('2d');
    c.scale(res, res);
    for (var y = 0; y < CHUNK; y++) for (var x = 0; x < CHUNK; x++) {
      var tx = cx * CHUNK + x, ty = cy * CHUNK + y;
      if (tx >= map.w || ty >= map.h) continue;
      var ch = SPK.tileAt(map, tx, ty);
      if (ch === 'B' && !SPK.isSolid(map, tx, ty, collideCtx())) ch = map.floor;
      c.save(); c.translate(x * TILE, y * TILE);
      drawTile(c, floorChar(ch), tx, ty, map.cave);
      c.restore();
    }
    chunks[key] = cv;
    return cv;
  }

  function drawWorld() {
    var hw = W / 2 / scale, hh = H / 2 / scale;
    var x0 = cam.x - hw, y0 = cam.y - hh, x1 = cam.x + hw, y1 = cam.y + hh;
    var span = CHUNK * TILE;
    for (var cy = Math.max(0, Math.floor(y0 / span)); cy <= Math.floor(y1 / span); cy++) {
      for (var cx = Math.max(0, Math.floor(x0 / span)); cx <= Math.floor(x1 / span); cx++) {
        if (cx * CHUNK >= map.w || cy * CHUNK >= map.h) continue;
        // overlap by ~1 device pixel so chunk edges never show a seam
        ctx.drawImage(getChunk(cx, cy), cx * span, cy * span, span + 1 / scale, span + 1 / scale);
      }
    }
    // water shimmer on visible water tiles
    var tx0 = Math.max(0, Math.floor(x0 / TILE)), ty0 = Math.max(0, Math.floor(y0 / TILE));
    var tx1 = Math.min(map.w - 1, Math.floor(x1 / TILE)), ty1 = Math.min(map.h - 1, Math.floor(y1 / TILE));
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (var ty = ty0; ty <= ty1; ty++) for (var tx = tx0; tx <= tx1; tx++) {
      if (SPK.tileAt(map, tx, ty) !== '~') continue;
      var ph = clock * 1.6 + hash(tx, ty) * 6.28;
      ctx.fillRect(tx * TILE + 6 + Math.sin(ph) * 4, ty * TILE + 10 + hash(ty, tx) * 12, 9, 2);
    }
    drawEntities(tx0, ty0, tx1, ty1);
    drawTrail();
    if (map.id === SPK.CRITTER.map) emoji(SPK.CRITTER.emoji, (SPK.CRITTER.tx + 0.5) * TILE, (SPK.CRITTER.ty + 0.5) * TILE - Math.abs(Math.sin(clock * 3)) * 4, TILE * 0.8);
  }

  function emoji(ch, x, y, size) {
    ctx.font = Math.round(size) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';
    ctx.fillText(ch, x, y);
  }
  function drawEntities(tx0, ty0, tx1, ty1) {
    for (var i = 0; i < map.entities.length; i++) {
      var e = map.entities[i];
      if (e.tx < tx0 - 1 || e.tx > tx1 + 1 || e.ty < ty0 - 1 || e.ty > ty1 + 1) continue;
      var x = (e.tx + 0.5) * TILE, y = (e.ty + 0.5) * TILE;
      if (e.kind === 'F') {
        var lit = state.campfires.indexOf(e.id) >= 0;
        ctx.fillStyle = '#7c4a1e'; ctx.fillRect(x - 11, y + 6, 22, 5);
        if (lit) {
          var f = 1 + Math.sin(clock * 9 + e.tx) * 0.08;
          ctx.fillStyle = 'rgba(253,186,116,.35)'; ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.fill();
          ctx.fillStyle = '#fb923c'; ctx.beginPath(); ctx.ellipse(x, y, 8 * f, 12 * f, 0, 0, 7); ctx.fill();
          ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.ellipse(x, y + 3, 4 * f, 7 * f, 0, 0, 7); ctx.fill();
        } else {
          ctx.fillStyle = '#a16207'; ctx.fillRect(x - 9, y + 1, 18, 5);
        }
      } else if (e.kind === 'C') {
        var open = state.chests.indexOf(e.id) >= 0;
        ctx.fillStyle = '#b45309'; ctx.fillRect(x - 11, y - 4, 22, 14);
        ctx.fillStyle = open ? '#78350f' : '#d97706'; ctx.fillRect(x - 12, y - (open ? 12 : 9), 24, open ? 6 : 8);
        ctx.fillStyle = '#fde047'; ctx.fillRect(x - 2, y - 3, 4, 5);
        if (!open) { ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.4 * Math.sin(clock * 3 + e.tx)) + ')'; ctx.fillRect(x + 7, y - 13, 3, 3); }
      } else if (e.kind === 'H') {
        if (state.heartPieces.indexOf(e.id) < 0) emoji('💗', x, y + Math.sin(clock * 3) * 2, TILE * 0.6);
      } else if (e.kind === 'P') {
        ctx.fillStyle = '#d6d3d1'; ctx.fillRect(x - 10, y - 2, 20, 12);
        if (!state.powers.mighty) {
          ctx.fillStyle = 'rgba(250,204,21,' + (0.35 + 0.25 * Math.sin(clock * 4)) + ')'; ctx.beginPath(); ctx.arc(x, y - 10, 14, 0, 7); ctx.fill();
          emoji('🌟', x, y - 10 + Math.sin(clock * 3) * 2, TILE * 0.55);
        }
      }
    }
  }

  function drawPlayer() {
    ctx.save();
    ctx.translate(state.x, state.y);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, TILE * 0.38, TILE * 0.36, TILE * 0.12, 0, 0, 7); ctx.fill();
    if (state.powers.mighty) {
      ctx.fillStyle = 'rgba(250,204,21,' + (0.22 + 0.1 * Math.sin(clock * 3)) + ')';
      ctx.beginPath(); ctx.arc(Math.cos(state.facing) > 0.1 ? 8 : -8, -12, 9, 0, 7); ctx.fill();
    }
    if ((state.fx.invulnUntil || 0) > now() && Math.floor(now() / 200) % 2) ctx.globalAlpha = 0.35; // 2.5 Hz blink
    if (Math.cos(state.facing) > 0.1) ctx.scale(-1, 1); // the emoji faces left
    if (horn.dash) ctx.rotate(-0.25);
    emoji('🦄', 0, 0, TILE * 1.1);
    ctx.restore();
  }

  var SLIME_COLORS = [['#4ade80', '#16a34a'], ['#f472b6', '#db2777'], ['#60a5fa', '#2563eb']];
  function drawSlime(e) {
    var big = e.kind === 'slimeBig' ? 1.35 : e.kind === 'slimeMini' ? 0.7 : 1;
    var hopUp = e.hop > 0 ? Math.sin((1 - e.hop / 0.35) * Math.PI) * 6 : 0;
    var sq = 1 + e.squish * 0.25, w = 12 * big * sq, h = 10 * big / sq;
    var c = SLIME_COLORS[e.hue % 3];
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(e.x, e.y + 8 * big, w, 3.5 * big, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(e.x, e.y - Math.max(0, hopUp));
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : c[0];
    ctx.beginPath(); ctx.moveTo(-w, 8 * big); ctx.quadraticCurveTo(-w, -h * 1.4, 0, -h * 1.4); ctx.quadraticCurveTo(w, -h * 1.4, w, 8 * big); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = c[1]; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(-w * 0.45, -h * 0.7, 2.5 * big, 3.5 * big, -0.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#1f2937';
    ctx.beginPath(); ctx.arc(-3.5 * big, -1 * big, 1.8 * big, 0, 7); ctx.arc(3.5 * big, -1 * big, 1.8 * big, 0, 7); ctx.fill();
    ctx.restore();
  }
  function drawMushroom(e) {
    var sq = 1 + e.squish * 0.3;
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(e.x, e.y + 10, 11, 3.5, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(e.x, e.y); ctx.scale(sq, 1 / sq);
    ctx.fillStyle = e.flash > 0 ? '#fff' : '#fde7c8'; ctx.fillRect(-6, -2, 12, 12);
    ctx.fillStyle = e.flash > 0 ? '#fff' : '#ef4444';
    ctx.beginPath(); ctx.arc(0, -2, 13, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-6, -8, 2.5, 0, 7); ctx.arc(4, -11, 2, 0, 7); ctx.arc(8, -5, 1.8, 0, 7); ctx.fill();
    ctx.fillStyle = '#1f2937';
    ctx.beginPath(); ctx.arc(-3, 3, 1.5, 0, 7); ctx.arc(3, 3, 1.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 1.5; // grumpy eyebrows
    ctx.beginPath(); ctx.moveTo(-5.5, -0.5); ctx.lineTo(-1.5, 1); ctx.moveTo(5.5, -0.5); ctx.lineTo(1.5, 1); ctx.stroke();
    ctx.restore();
  }
  function drawCombat() {
    pickups.forEach(function (p) {
      var bob = p.z + Math.sin(p.t * 5) * 1.5;
      if (p.kind === 'gem') {
        ctx.save(); ctx.translate(p.x, p.y - bob - 4);
        ctx.fillStyle = '#22d3ee'; ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(5, 0); ctx.lineTo(0, 7); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(-2, -3, 2, 3);
        ctx.restore();
      } else if (p.kind === 'heart') emoji('💗', p.x, p.y - bob - 4, TILE * 0.45);
      else {
        ctx.fillStyle = 'rgba(196,181,253,' + (0.45 + 0.2 * Math.sin(p.t * 6)) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y - bob - 6, TILE * 0.42, 0, 7); ctx.fill();
        emoji(SPK.POWERUPS[p.kind].icon, p.x, p.y - bob - 6, TILE * 0.5);
      }
    });
    var list = enemies.slice().sort(function (a, b) { return a.y - b.y; });
    var drewPlayer = false;
    for (var i = 0; i < list.length; i++) {
      if (!drewPlayer && list[i].y > state.y) { drawPlayer(); drewPlayer = true; }
      if (list[i].kind === 'mushroom') drawMushroom(list[i]); else drawSlime(list[i]);
    }
    if (!drewPlayer) drawPlayer();
    drawSwirl();
    drawFliers();
    spores.forEach(function (p) {
      ctx.fillStyle = 'rgba(190,242,100,.85)'; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 7); ctx.fill();
      ctx.strokeStyle = '#65a30d'; ctx.lineWidth = 1.5; ctx.stroke();
    });
    bolts.forEach(function (b) {
      var a = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
      ctx.fillStyle = 'rgba(253,224,71,.35)'; ctx.beginPath(); ctx.ellipse(-8, 0, 12, 5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = b.color || '#fef08a'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(1, -1, 2, 0, 7); ctx.fill();
      ctx.restore();
    });
    parts.forEach(function (q) {
      ctx.globalAlpha = Math.max(0, 1 - q.t / q.life);
      ctx.fillStyle = q.c; ctx.fillRect(q.x - q.r / 2, q.y - q.r / 2, q.r, q.r);
    });
    ctx.globalAlpha = 1;
  }

  // ── HUD (screen space) ───────────────────────────────────────────────
  function drawHeart(x, y, s, fill) { // fill: 0, 0.5 or 1
    ctx.save(); ctx.translate(x, y); ctx.scale(s / 20, s / 20);
    var path = function () { ctx.beginPath(); ctx.moveTo(10, 18); ctx.bezierCurveTo(-6, 8, 0, -4, 10, 4); ctx.bezierCurveTo(20, -4, 26, 8, 10, 18); ctx.closePath(); };
    path(); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
    if (fill > 0) {
      ctx.save(); path(); ctx.clip();
      ctx.fillStyle = '#f43f5e'; ctx.fillRect(-2, -6, fill >= 1 ? 26 : 12, 26);
      ctx.restore();
    }
    path(); ctx.lineWidth = 2; ctx.strokeStyle = '#9f1239'; ctx.stroke();
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawHUD() {
    var ins = insets(), x = ins.l + 12, y = ins.t + 12, s = Math.max(22, Math.min(30, W / 28));
    var hearts = state.hpMax / 2;
    for (var i = 0; i < hearts; i++) {
      var f = Math.max(0, Math.min(1, (state.hp - i * 2) / 2));
      drawHeart(x + (i % 8) * (s + 3), y + Math.floor(i / 8) * (s + 3), s, f);
    }
    var gy = y + Math.ceil(hearts / 8) * (s + 3) + 4;
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    roundRect(x - 4, gy - 2, 86, s + 4, 12); ctx.fill();
    emoji('💎', x + s / 2, gy + s / 2, s * 0.8);
    ctx.fillStyle = '#5b21b6'; ctx.font = '700 ' + Math.round(s * 0.75) + 'px Fredoka, ui-rounded, system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(String(state.gems), x + s + 4, gy + s / 2 + 1);
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = map && map.cave ? '#1c1714' : '#2f9e44';
    ctx.fillRect(0, 0, W, H);
    if (!map || state.mode === 'title' || state.mode === 'choose') return;
    ctx.save();
    ctx.translate(Math.round(W / 2), Math.round(H / 2)); ctx.scale(scale, scale); ctx.translate(-cam.x, -cam.y);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 8 * shake / 0.12, (Math.random() - 0.5) * 8 * shake / 0.12);
    drawWorld();
    drawCombat();
    ctx.restore();
    if (map.cave) {
      var g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.7);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    speaker = null;
    if (state.mode === 'play') { drawBubble(); drawHUD(); drawPowerTimers(); drawControls(); }
    if (state.mode === 'sleepy') drawSleepy();
    if (state.mode === 'reveal') drawReveal();
    if (fade) {
      ctx.fillStyle = 'rgba(15,10,30,' + Math.max(0, 1 - Math.abs(fade.t / fade.dur * 2 - 1)) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function frame(t) {
    requestAnimationFrame(frame);
    try {
      var dt = last ? Math.min(0.05, Math.max(0, (t - last) / 1000)) : 0;
      last = t;
      frames++;
      update(dt);
      draw();
    } catch (e) {
      errors++;
      if (errors < 20) console.error(e);
    }
  }

  window.__spk = {
    get state() { return state; },
    get frames() { return frames; },
    get errors() { return errors; },
    get bolts() { return stats.bolts; },
    get pops() { return stats.pops; },
    get inputs() { return { active: input.active(), lastReset: input.lastReset, move: input.moveVec() }; },
    layout: function () { return input.layout(); },
    _teleport: function (mapId, tx, ty) { teleport(mapId, tx, ty); },
    _spawn: function (kind, tx, ty) { spawnEnemy(kind, (tx + 0.5) * TILE, (ty + 0.5) * TILE, null); },
    _clearEnemies: function () { enemies = []; spores = []; },
    _give: function (kind) { if (SPK.POWERUPS[kind]) SPK.grantPowerup(state, kind, now()); else state.powers[kind] = true; },
    get enemies() { return enemies.length; },
  };

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
