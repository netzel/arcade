<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sparklehorn Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #1e293b;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    font-family: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
    color: #3b1d6e; overscroll-behavior: none;
  }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(circle at 50% 35%, #a7f3d0 0%, #6ee7b7 35%, #8b5cf6 100%);
    touch-action: none; transition: opacity .3s ease, visibility .3s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .logo { font-size: clamp(34px, 8vmin, 72px); font-weight: 700; color: #fff; text-align: center; line-height: 1;
    text-shadow: 0 4px 0 #6d28d9, 0 8px 24px rgba(0,0,0,.25); }
  .logo small { display: block; font-size: .45em; color: #fef3c7; margin-top: .3em; }
  .hero { font-size: clamp(64px, 18vmin, 150px); line-height: 1; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } }
  .big {
    font: inherit; font-weight: 700; border: none; border-radius: 999px; cursor: pointer;
    background: #fff; color: #6d28d9; box-shadow: 0 6px 0 #6d28d9, 0 10px 24px rgba(0,0,0,.2);
    font-size: clamp(26px, 6vmin, 44px); padding: .35em 1.2em; min-width: 140px; min-height: 72px;
    touch-action: manipulation;
  }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #6d28d9; }
  .row { display: flex; gap: 4vmin; flex-wrap: wrap; justify-content: center; }
  .pick { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: .3em .9em; }
  .pick .e { font-size: 1.6em; line-height: 1.1; }
  .pick .l { font-size: .55em; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="overlay" id="title">
  <div class="logo">Sparklehorn<small>Adventure</small></div>
  <div class="hero" aria-hidden="true">🦄</div>
  <button class="big" id="play" type="button" aria-label="Play">▶</button>
</div>

<div class="overlay hidden" id="diff">
  <div class="row">
    <button class="big pick" id="easy" type="button" aria-label="Easy"><span class="e">🐣</span><span class="l">Easy</span></button>
    <button class="big pick" id="normal" type="button" aria-label="Normal"><span class="e">🦄</span><span class="l">Normal</span></button>
  </div>
</div>

<div class="overlay hidden" id="welcome">
  <div class="hero" aria-hidden="true">🦄✨</div>
  <div class="logo" style="font-size:clamp(26px,6vmin,48px)">Welcome back!</div>
  <button class="big" id="resume" type="button" aria-label="Keep playing">▶</button>
</div>

  // ── Keyboard ─────────────────────────────────────────────────────────

  // ── World ────────────────────────────────────────────────────────────

  var doorArmed = false, fade = null, exploreT = 0, clock = 0, moving = false;
  var BODY_R = TILE * 0.32;

  }

  // Enemies never use your powers: no walking on water just because you can.

  function tileUnder(x, y) { return SPK.tileAt(map, Math.floor(x / TILE), Math.floor(y / TILE)); }

  }
  function goThroughDoor(doorId) {

  // ── Enemies, bolts, particles, pickups ───────────────────────────────

  var horn = { cd: 0, dash: null }, magicCd = 0, autoCd = 0;
  var hitPause = 0, shake = 0, sleepyT = 0, revealT = 0, reveal = null;
  var ACTIVE_R = 14 * TILE, MAX_ACTIVE = 25;

    });
    map.entities.forEach(function (g, gi) {

        : g.kind === 'a' ? ['bat', 'bat', 'bat'].slice(0, 2 + gi % 2)
        : g.kind === 'f' ? ['frog', 'frog', 'frog'].slice(0, 2 + gi % 2)
        : g.kind === 'z' ? ['bee', 'bee', 'bee'].slice(0, 2 + gi % 2)
        : g.kind === 'r' ? ['beetle', 'beetle']

        var a = i * 2.4, rr = i ? TILE * 0.9 : 0;
        var x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
        if (SPK.isSolid(map, Math.floor(x / TILE), Math.floor(y / TILE), enemyCtx())) { x = cx; y = cy; }
        spawnEnemy(kind, x, y, g.id);
      });
    });
  }
  function nearFire(x, y) {
    for (var i = 0; i < fires.length; i++) if (Math.hypot(fires[i].x - x, fires[i].y - y) < 3 * TILE) return true;
    return false;
  }
  function burst(x, y, n, colors, speed) {

      var a = Math.random() * Math.PI * 2, s = (0.4 + Math.random()) * (speed || 90);
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: 0.5 + Math.random() * 0.4, t: 0,

    }
  }
  function popEnemy(e) {

    stats.pops++;

    if (Math.random() < 0.12) dropPickup('heart', e.x, e.y);

      if (Math.hypot(p.x - state.x, p.y - state.y) < TILE * 0.45) { spores.splice(s, 1); playerHit(SPK.enemyHit(state, p.dmg), p.x, p.y); }

  // ── King Grumpcap ────────────────────────────────────────────────────

    get bolts() { return stats.bolts; },
    get pops() { return stats.pops; },
    get inputs() { return { active: input.active(), lastReset: input.lastReset, move: input.moveVec() }; },
    layout: function () { return input.layout(); },
    view: function () { return { camX: cam.x, camY: cam.y, scale: scale }; },
    _teleport: function (mapId, tx, ty) { teleport(mapId, tx, ty); },
    _spawn: function (kind, tx, ty) { spawnEnemy(kind, (tx + 0.5) * TILE, (ty + 0.5) * TILE, null); },
    _clearEnemies: function () { enemies = []; spores = []; },
    closetHits: function () { return closetUI ? closetUI.hits.map(function (h) { return { x: h.x, y: h.y, r: h.r, act: h.act, id: h.id || null }; }) : []; },
    mapHits: function () { return mapUI ? mapUI.hits.map(function (h) { return { x: h.x, y: h.y, r: h.r, act: h.act, id: h.id || null }; }) : []; },
    _give: function (kind) { if (SPK.POWERUPS[kind]) SPK.grantPowerup(state, kind, now()); else state.powers[kind] = true; },
    get enemies() { return enemies.length; },
    get boss() { return boss ? { happy: !!boss.happy, hp: boss.hp, act: boss.act || null, phase: boss.phase || null, x: boss.x, y: boss.y } : null; },
    get crown() { return crownPick ? { x: crownPick.x, y: crownPick.y } : null; },
    get hint() { return trailOn(); },
  };

  // ── Saves (through the arcade) ───────────────────────────────────────
  function getState() {
    if (state.mode === 'title' || state.mode === 'choose') return null;
    return SPK.getSave(state);
  }
  function setState(saved) {
    var next;
    try { next = SPK.applySave(SPK.validateSave(saved)); }
    catch (e) {
      // Can't read it: show the title (never a blank screen) and let the arcade know.
      state = { mode: 'title' }; map = null;
      show('title', true); show('diff', false); show('welcome', false);
      throw e;
    }
    state = next;
    map = null;
    show('title', false); show('diff', false); show('welcome', true);
    resetInput('restore');
  }
  onTap($('resume'), function () {
    if (state.mode !== 'welcome') return;
    state.mode = 'play';
    show('welcome', false);
    onDiscovery();
    resetInput('resume');
  });
  if (window.ArcadeBridge) {
    // A save is on its way: skip the title so it never flashes up.
    try { if (ArcadeBridge.peekRestore && ArcadeBridge.peekRestore(1)) show('title', false); } catch (e) { /* ignore */ }
    ArcadeBridge.register({ version: 1, getState: getState, setState: setState });
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
