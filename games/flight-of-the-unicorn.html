<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Flight of the Unicorn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #6ec6ff;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    font-family: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
    color: #3b1d6e;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    transition: opacity .35s ease, visibility .35s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  /* ---------- Title ---------- */
  #title { justify-content: space-between; }
  .logo { text-align: center; margin-top: 2vh; line-height: .95; animation: float 3s ease-in-out infinite; }
  .logo small {
    display: block; font-size: clamp(18px, 4.2vmin, 34px); font-weight: 600; color: #fff;
    text-shadow: 0 2px 0 #7c3aed, 0 4px 12px rgba(80, 30, 160, .35); letter-spacing: .02em;
  }
  .logo b {
    display: block; font-size: clamp(44px, 12vmin, 104px); font-weight: 700;
    background: linear-gradient(90deg, #ff5e8a, #ffa94d, #ffe14d, #6ee26e, #4dc3ff, #a77bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 2px #fff; filter: drop-shadow(0 4px 0 #7c3aed) drop-shadow(0 8px 16px rgba(80,30,160,.35));
  }
  .title-bottom { display: flex; flex-direction: column; align-items: center; gap: 1.6vh; margin-bottom: 1vh; }
  .tap-hint {
    font-size: clamp(22px, 5.5vmin, 40px); font-weight: 700; color: #fff;
    background: linear-gradient(180deg, #ff7eb6, #e8459a); padding: .35em 1.1em; border-radius: 999px;
    box-shadow: 0 6px 0 #b0277a, 0 10px 24px rgba(176, 39, 122, .4);
    animation: pulse 1.1s ease-in-out infinite; pointer-events: none;
  }
  .skins { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .skin {
    width: clamp(52px, 11vmin, 72px); height: clamp(52px, 11vmin, 72px); border-radius: 50%;
    border: 4px solid rgba(255,255,255,.75); background: var(--c); position: relative; cursor: pointer;
    box-shadow: 0 4px 0 rgba(60, 20, 120, .35); font: inherit; padding: 0; transition: transform .15s;
  }
  .skin::after {
    content: ''; position: absolute; inset: 22% 22% auto auto; width: 26%; height: 26%;
    border-radius: 50%; background: var(--m);
  }
  .skin.on { border-color: #ffe14d; transform: scale(1.15); box-shadow: 0 0 0 4px #fff, 0 6px 16px rgba(255, 200, 0, .6); }
  .skin.locked { filter: grayscale(.9) brightness(.85); }
  .skin.locked::before {
    content: '🔒'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; z-index: 1;
  }
  .skin .need {
    position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); z-index: 2;
    background: #3b1d6e; color: #ffe14d; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap;
  }
  .skin-name { color: #fff; font-weight: 600; font-size: clamp(15px, 3.4vmin, 22px); text-shadow: 0 2px 0 rgba(80, 30, 160, .55); min-height: 1.3em; }
  .jar {
    color: #3b1d6e; background: rgba(255,255,255,.85); padding: 4px 14px; border-radius: 999px;
    font-weight: 600; font-size: clamp(14px, 3vmin, 19px);
  }

  /* ---------- Ready ---------- */
  #ready { justify-content: flex-end; pointer-events: none; }
  #ready .tap-hint { margin-bottom: 18vh; }

  /* ---------- Game over ---------- */
  #over { justify-content: center; background: rgba(40, 10, 90, .25); }
  .card {
    width: min(440px, 100%); max-height: 100%; overflow: auto;
    background: linear-gradient(180deg, #fffaff, #f3e8ff); border-radius: 28px; padding: 22px 22px 18px;
    border: 4px solid #fff; box-shadow: 0 10px 0 #b79cf2, 0 20px 50px rgba(50, 10, 110, .45);
    text-align: center; display: flex; flex-direction: column; gap: 14px;
    transform: translateY(0) scale(1); transition: transform .45s cubic-bezier(.2, 1.6, .4, 1);
  }
  #over.hidden .card { transform: translateY(60px) scale(.85); }
  .info { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .medal { font-size: clamp(48px, 12vmin, 72px); line-height: 1; animation: bob 1.6s ease-in-out infinite; }
  .over-msg { margin: 0; font-size: clamp(24px, 6vmin, 36px); color: #7c3aed; }
  .scores { display: flex; gap: 12px; justify-content: center; width: 100%; }
  .scores div { flex: 1; max-width: 150px; background: #fff; border-radius: 18px; padding: 6px 8px; box-shadow: inset 0 -4px 0 #eadcff; }
  .scores small { display: block; font-size: 14px; color: #8a6bc4; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .scores b { font-size: clamp(32px, 8vmin, 48px); line-height: 1.1; }
  .newbest {
    font-weight: 700; color: #fff; background: linear-gradient(90deg, #ff5e8a, #ffa94d, #ffd23f);
    padding: 4px 16px; border-radius: 999px; animation: pop .6s cubic-bezier(.2, 1.8, .4, 1) both, pulse 1.2s .6s ease-in-out infinite;
  }
  .runstars { font-weight: 600; font-size: 18px; }
  .unlock { font-weight: 600; font-size: 15px; color: #8a6bc4; }
  .unlock.yay { color: #e8459a; font-size: 18px; animation: pop .6s cubic-bezier(.2, 1.8, .4, 1) both; }
  .actions { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .btn {
    font: inherit; font-weight: 700; border: 0; border-radius: 999px; cursor: pointer; color: #fff;
    transition: transform .1s, opacity .3s;
  }
  .btn:active { transform: translateY(4px) scale(.98); }
  .btn-go {
    font-size: clamp(24px, 6vmin, 32px); padding: 14px 40px; width: 100%; max-width: 320px;
    background: linear-gradient(180deg, #5ee38a, #22b25a); box-shadow: 0 6px 0 #168a43, 0 10px 20px rgba(22, 138, 67, .35);
  }
  .btn-alt { font-size: 17px; padding: 9px 22px; background: #a77bff; box-shadow: 0 4px 0 #7c3aed; }
  #over:not(.armed) .btn { opacity: .55; pointer-events: none; }

  @media (max-height: 500px) {
    .card { flex-direction: row; align-items: center; width: min(640px, 100%); padding: 14px 18px; gap: 18px; }
    .info { flex: 1.3; gap: 4px; }
    .actions { flex: 1; }
    .medal { font-size: 40px; }
    .scores b { font-size: 30px; }
    .logo { margin-top: 0; }
    .title-bottom { gap: 8px; }
  }

  @keyframes float { 50% { transform: translateY(-8px); } }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-6deg); } }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="overlay">
  <div class="logo"><small>Flight of the</small><b>Unicorn</b></div>
  <div class="title-bottom">
    <div class="tap-hint">👆 Tap to fly!</div>
    <div class="skin-name" id="skinName"></div>
    <div class="skins" id="skins"></div>
    <div class="jar">⭐ <span id="jarCount">0</span> stars collected</div>
  </div>
</div>

<div id="ready" class="overlay hidden">
  <div class="tap-hint">👆 Tap to fly!</div>
</div>

<div id="over" class="overlay hidden">
  <div class="card" role="dialog" aria-labelledby="overMsg">
    <div class="info">
      <div class="medal" id="medal">🦄</div>
      <h2 class="over-msg" id="overMsg">Great flying!</h2>
      <div class="scores">
        <div><small>Score</small><b id="overScore">0</b></div>
        <div><small>Best</small><b id="overBest">0</b></div>
      </div>
      <div class="newbest" id="newBest" hidden>✨ New best! ✨</div>
      <div class="runstars" id="runStars"></div>
      <div class="unlock" id="unlockMsg"></div>
    </div>
    <div class="actions">
      <button class="btn btn-go" id="again" type="button">▶ Fly again!</button>
      <button class="btn btn-alt" id="toTitle" type="button">🦄 Pick a unicorn</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ================= Setup =================
  const VH = 600;               // world height in units; width depends on screen shape
  const GROUND = 532;           // top of the grass
  const STORE_KEY = 'flight-of-the-unicorn:v1';
  const RAINBOW = ['#ff5e8a', '#ffa94d', '#ffe14d', '#6ee26e', '#4dc3ff', '#a77bff'];

  const SKINS = [
    { id: 'snow', name: 'Snowflake', need: 0, body: '#ffffff', shade: '#e6e0f5', mane: RAINBOW, horn: '#ffd23f', wing: '#e9f3ff', hoof: '#ffd23f' },
    { id: 'pink', name: 'Bubblegum', need: 10, body: '#ffc4e1', shade: '#f29cc6', mane: ['#ff4fa3', '#ff86c2', '#ffffff', '#ff86c2'], horn: '#fff1a8', wing: '#ffe3f1', hoof: '#ff4fa3' },
    { id: 'lav', name: 'Lavender', need: 30, body: '#dcc8ff', shade: '#b89cf0', mane: ['#7c3aed', '#a77bff', '#4dc3ff', '#a77bff'], horn: '#ffe14d', wing: '#f0e8ff', hoof: '#7c3aed' },
    { id: 'night', name: 'Starlight', need: 60, body: '#3a3f8f', shade: '#272b6b', mane: ['#ffe14d', '#ffffff', '#9be7ff', '#ffffff'], horn: '#ffe14d', wing: '#6d74d8', hoof: '#ffe14d' },
    { id: 'gold', name: 'Sunshine', need: 100, body: '#ffe27a', shade: '#f2c23a', mane: ['#ff7a1a', '#ff5e8a', '#ffffff', '#ff5e8a'], horn: '#ffffff', wing: '#fff6cc', hoof: '#ff7a1a' },
  ];

  const $ = (id) => document.getElementById(id);
  const canvas = $('c');
  const ctx = canvas.getContext('2d');
  let dpr = 1, scale = 1, W = 800;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    scale = innerHeight / VH;
    W = innerWidth / scale;
  }
  addEventListener('resize', resize);
  resize();

  // ================= Saved progress (best score + star jar only) =================
  let store = { best: 0, stars: 0, skin: 'snow' };
  try { store = Object.assign(store, JSON.parse(localStorage.getItem(STORE_KEY)) || {}); } catch (e) { /* private mode */ }
  function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignore */ } }
  const skinById = (id) => SKINS.find((s) => s.id === id) || SKINS[0];
  const unlocked = (s) => store.stars >= s.need;
  let skin = skinById(store.skin);
  if (!unlocked(skin)) skin = SKINS[0];

  // ================= Sound (tiny Web Audio synth) =================
  let actx = null;
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, { at = 0, dur = 0.12, type = 'sine', vol = 0.15, slide = 0 } = {}) {
    const a = actx; if (!a) return;
    const t = a.currentTime + at;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    flap: () => tone(480 + Math.random() * 60, { dur: 0.1, slide: 260, vol: 0.09 }),
    point: () => { tone(1046, { dur: 0.1, type: 'triangle', vol: 0.12 }); tone(1318, { at: 0.07, dur: 0.16, type: 'triangle', vol: 0.12 }); },
    star: () => [1568, 1976, 2349, 3136].forEach((f, i) => tone(f, { at: i * 0.045, dur: 0.12, vol: 0.07 })),
    bonk: () => { tone(260, { dur: 0.22, type: 'square', slide: -150, vol: 0.08 }); tone(140, { dur: 0.25, type: 'sine', vol: 0.18 }); },
    fall: () => tone(700, { at: 0.12, dur: 0.6, slide: -480, vol: 0.06, type: 'triangle' }),
    cheer: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, { at: i * 0.09, dur: 0.22, type: 'triangle', vol: 0.12 })),
    fanfare: () => [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, { at: i * 0.1, dur: i === 6 ? 0.5 : 0.16, type: 'triangle', vol: 0.13 })),
    tick: () => tone(880, { dur: 0.06, vol: 0.06 }),
  };

  // ================= Game state =================
  // state: 'title' -> 'play' -> 'dying' -> 'over' -> 'ready' -> 'play' ...
  let state = 'title';
  let clock = 0;               // game time (seconds), only advances while running
  let dist = 0;                // how far the world has scrolled
  let score = 0, runStars = 0, nextMilestone = 10;
  let starsBefore = 0;         // jar total at the start of this run
  let skyPhase = 0;            // smoothed day/night cycle position
  let shake = 0, flash = 0, overAt = 0;
  const uni = { x: 0, y: 260, vy: 0, rot: 0, wing: 0, spin: 0 };
  let pillars = [], stars = [], particles = [], trail = [], banners = [];
  let lastGapY = 290, nextPillarX = 0;

  const PILLAR_W = 78;
  const R_HIT = 15;            // forgiving: smaller than the drawn unicorn

  function unicornX() { return Math.max(70, Math.min(W * 0.3, 190)); }

  const difficulty = () => ({
    gap: score < 4 ? 235 : Math.max(168, 222 - (score - 4) * 2.2),
    speed: Math.min(245, 140 + score * 3.2),
    spacing: Math.max(235, 290 - score * 2),
    jump: Math.min(230, 120 + score * 4),
  });

  function resetRun() {
    score = 0; runStars = 0; nextMilestone = 10;
    starsBefore = store.stars;
    pillars = []; stars = []; banners = []; trail = [];
    uni.x = unicornX(); uni.y = 260; uni.vy = 0; uni.rot = 0; uni.spin = 0;
    lastGapY = 290;
    nextPillarX = W + 120;       // a little breathing room before the first one
  }

  function spawnPillar() {
    const d = difficulty();
    const margin = 85;
    const lo = margin + d.gap / 2, hi = GROUND - margin - d.gap / 2;
    let gy = lastGapY + (Math.random() * 2 - 1) * d.jump;
    gy = Math.max(lo, Math.min(hi, gy));
    const prev = pillars[pillars.length - 1];
    const p = { x: nextPillarX, gapY: gy, gap: d.gap, passed: false, hue: Math.floor(Math.random() * RAINBOW.length) };
    pillars.push(p);
    // Stars: often in the gap, sometimes floating between pillars
    if (Math.random() < 0.55) stars.push({ x: p.x + PILLAR_W / 2, y: gy + (Math.random() * 2 - 1) * d.gap * 0.2, got: false, t: Math.random() * 6 });
    if (prev && Math.random() < 0.4) stars.push({ x: (prev.x + p.x) / 2 + PILLAR_W / 2, y: (prev.gapY + gy) / 2, got: false, t: Math.random() * 6 });
    lastGapY = gy;
    nextPillarX += d.spacing;
  }

  // ================= Input =================
  function flap() {
    uni.vy = -390;
    uni.wing = 1;
    sfx.flap();
    for (let i = 0; i < 4; i++) puff(uni.x - 14, uni.y + 10, '#ffffff', 60);
  }

  function action() {
    audio();
    if (state === 'title') { hide('title'); resetRun(); state = 'play'; flap(); }
    else if (state === 'ready') { hide('ready'); state = 'play'; flap(); }
    else if (state === 'play') flap();
    else if (state === 'over' && clock - overAt > 1.2) restart();
  }

  function restart() {
    if (state !== 'over') return;
    sfx.tick();
    hide('over');
    resetRun();
    state = 'ready';
    show('ready');
  }

  function toTitle() {
    if (state !== 'over') return;
    sfx.tick();
    hide('over');
    resetRun();
    state = 'title';
    renderSkins();
    show('title');
  }

  addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;    // buttons handle themselves
    if (e.button && e.button !== 0) return;
    e.preventDefault();
    action();
  }, { passive: false });
  addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) {
      e.preventDefault();
      if (e.code === 'Enter' && state === 'over') { if (clock - overAt > 0.6) restart(); return; }
      action();
    }
  });
  // Stop iOS long-press / double-tap zoom menus
  addEventListener('touchstart', (e) => { if (!e.target.closest('button')) e.preventDefault(); }, { passive: false });
  addEventListener('contextmenu', (e) => e.preventDefault());

  $('again').addEventListener('click', restart);
  $('toTitle').addEventListener('click', toTitle);

  const show = (id) => $(id).classList.remove('hidden');
  const hide = (id) => $(id).classList.add('hidden');

  // ================= Title: unicorn picker =================
  function renderSkins() {
    $('jarCount').textContent = store.stars;
    $('skinName').textContent = skin.name;
    const box = $('skins');
    box.innerHTML = '';
    SKINS.forEach((s) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'skin' + (s === skin ? ' on' : '') + (unlocked(s) ? '' : ' locked');
      b.style.setProperty('--c', s.body);
      b.style.setProperty('--m', s.mane[0]);
      b.setAttribute('aria-label', unlocked(s) ? s.name : `${s.name} (needs ${s.need} stars)`);
      if (!unlocked(s)) {
        const n = document.createElement('span');
        n.className = 'need'; n.textContent = `⭐${s.need}`;
        b.appendChild(n);
      }
      b.addEventListener('click', () => {
        audio();
        if (!unlocked(s)) {
          tone(300, { dur: 0.15, type: 'triangle', vol: 0.1 });
          $('skinName').textContent = `Collect ${s.need - store.stars} more ⭐ for ${s.name}!`;
          return;
        }
        skin = s; store.skin = s.id; persist();
        sfx.star();
        renderSkins();
      });
      box.appendChild(b);
    });
  }
  renderSkins();

  // ================= Effects =================
  function puff(x, y, color, spd = 120, size = 5, life = 0.5) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.6);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, color, size: size * (0.6 + Math.random() * 0.8), kind: 'dot' });
  }
  function sparkle(x, y, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, v = 120 + Math.random() * 120;
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.7, max: 0.7, color: RAINBOW[i % 6], size: 5 + Math.random() * 3, kind: 'star', rot: Math.random() * 6 });
    }
  }
  function confetti(n = 60) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x: Math.random() * W, y: -20 - Math.random() * 200, vx: (Math.random() - 0.5) * 80, vy: 80 + Math.random() * 120,
        life: 4, max: 4, color: RAINBOW[i % 6], size: 6 + Math.random() * 5, kind: 'confetti', rot: Math.random() * 6, spin: (Math.random() - 0.5) * 10,
      });
    }
  }
  function popText(x, y, text, color = '#fff') {
    particles.push({ x, y, vx: 0, vy: -70, life: 0.9, max: 0.9, color, size: 26, kind: 'text', text });
  }
  const CHEERS = ['Super!', 'Awesome!', 'Magical!', 'Amazing!', 'Wow!', 'Fantastic!', 'Unstoppable!', 'Sparkly!'];
  function banner(text) { banners.push({ text, t: 0 }); }

  // ================= Update =================
  function update(dt) {
    clock += dt;
    const d = difficulty();
    const moving = state === 'play' || state === 'title' || state === 'ready';
    const speed = state === 'play' ? d.speed : (moving ? 90 : 0);
    dist += speed * dt;

    // Smooth day -> sunset -> night -> dawn cycle as the score climbs
    const target = score / 12;
    skyPhase += (target - skyPhase) * Math.min(1, dt * 1.5);

    uni.wing = Math.max(0, uni.wing - dt * 4);

    if (state === 'title' || state === 'ready') {
      uni.x += (unicornX() - uni.x) * Math.min(1, dt * 5);
      const hoverY = state === 'title' ? VH * 0.47 : 270;
      uni.y = hoverY + Math.sin(clock * 3) * 14;
      uni.vy = Math.cos(clock * 3) * 42;
      uni.rot = uni.vy / 900;
      if (Math.sin(clock * 3) > 0.95 && uni.wing < 0.1) uni.wing = 1;
    } else if (state === 'play') {
      uni.vy = Math.min(uni.vy + 1250 * dt, 560);
      uni.y += uni.vy * dt;
      if (uni.y < 22) { uni.y = 22; uni.vy = Math.max(uni.vy, 0); }   // the sky is soft: no ceiling deaths
      const targetRot = Math.max(-0.45, Math.min(0.9, uni.vy / 650));
      uni.rot += (targetRot - uni.rot) * Math.min(1, dt * 10);

      // World scroll
      for (const p of pillars) p.x -= speed * dt;
      for (const s of stars) s.x -= speed * dt;
      nextPillarX -= speed * dt;
      while (nextPillarX < W + 200) spawnPillar();
      pillars = pillars.filter((p) => p.x > -PILLAR_W - 20);
      stars = stars.filter((s) => s.x > -40 && !(s.got && s.t > 0.5));

      // Scoring + collisions
      for (const p of pillars) {
        if (!p.passed && p.x + PILLAR_W < uni.x) {
          p.passed = true; score++;
          sfx.point();
          popText(uni.x, uni.y - 40, '+1');
          if (score >= nextMilestone) {
            nextMilestone += 10;
            banner(`${CHEERS[(score / 10 - 1) % CHEERS.length]} ${score}!`);
            sfx.cheer();
            sparkle(uni.x, uni.y, 18);
          }
        }
        if (hitsPillar(p)) return crash();
      }
      for (const s of stars) {
        if (!s.got && Math.hypot(s.x - uni.x, s.y - uni.y) < 34) {
          s.got = true; s.t = 0; runStars++; store.stars++;
          sfx.star();
          sparkle(s.x, s.y, 10);
          popText(s.x, s.y - 28, '⭐', '#ffe14d');
        }
      }
      if (uni.y + R_HIT > GROUND) { uni.y = GROUND - R_HIT; return crash(); }

      // Rainbow trail
      trail.push({ x: uni.x - 20, y: uni.y + 4 });
    } else if (state === 'dying') {
      uni.vy = Math.min(uni.vy + 1300 * dt, 700);
      uni.y += uni.vy * dt;
      uni.spin += dt * 9;
      uni.rot = uni.spin;
      if (uni.y > GROUND - 18) {
        uni.y = GROUND - 18; uni.vy = 0;
        uni.rot = Math.PI * 0.08;
        if (clock - overAt > 0.5) gameOver();
      }
      if (clock - overAt > 1.6) gameOver();
      if (Math.random() < 0.4) puff(uni.x, uni.y - 30, RAINBOW[Math.floor(Math.random() * 6)], 40, 4, 0.6);
    }

    // Trail drifts left with the world
    for (const t of trail) t.x -= (state === 'play' ? speed : 0) * dt;
    if (trail.length > 60) trail.splice(0, trail.length - 60);
    trail = trail.filter((t) => t.x > -20);
    if (state !== 'play' && state !== 'dying') trail.length = 0;

    for (const s of stars) s.t += dt;
    for (const pt of particles) {
      pt.life -= dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      if (pt.kind === 'dot' || pt.kind === 'star') { pt.vx *= 0.94; pt.vy *= 0.94; }
      if (pt.kind === 'confetti') { pt.rot += pt.spin * dt; pt.vx += Math.sin(clock * 3 + pt.y * 0.02) * 4; }
    }
    particles = particles.filter((pt) => pt.life > 0);
    for (const b of banners) b.t += dt;
    banners = banners.filter((b) => b.t < 1.8);
    shake = Math.max(0, shake - dt);
    flash = Math.max(0, flash - dt * 3);
  }

  function hitsPillar(p) {
    if (uni.x + R_HIT < p.x + 6 || uni.x - R_HIT > p.x + PILLAR_W - 6) return false;
    const top = p.gapY - p.gap / 2, bot = p.gapY + p.gap / 2;
    // Nearest point on the two solid parts (forgiving rounded corners)
    const cx = Math.max(p.x + 6, Math.min(uni.x, p.x + PILLAR_W - 6));
    for (const [y0, y1] of [[-100, top], [bot, VH + 100]]) {
      const cy = Math.max(y0, Math.min(uni.y, y1));
      if (Math.hypot(uni.x - cx, uni.y - cy) < R_HIT) return true;
    }
    return false;
  }

  function crash() {
    state = 'dying';
    overAt = clock;
    shake = 0.3; flash = 1;
    uni.vy = -260; uni.spin = uni.rot;
    sfx.bonk(); sfx.fall();
    if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) { /* ignore */ }
    for (let i = 0; i < 14; i++) puff(uni.x, uni.y, RAINBOW[i % 6], 220, 6, 0.7);
    persist();   // keep the stars they caught even if they leave now
  }

  function gameOver() {
    if (state !== 'dying') return;
    state = 'over';
    overAt = clock;
    const isBest = score > store.best && score > 0;
    if (isBest) store.best = score;
    persist();

    $('overScore').textContent = score;
    $('overBest').textContent = store.best;
    $('newBest').hidden = !isBest;
    $('medal').textContent = score >= 40 ? '🏆' : score >= 20 ? '🥇' : score >= 10 ? '🥈' : score >= 5 ? '🥉' : '🦄';
    $('overMsg').textContent =
      score === 0 ? 'Tap, tap, tap to stay up!' :
      score < 3 ? 'Nice try!' :
      score < 10 ? 'Great flying!' :
      score < 20 ? 'Super flying!' :
      score < 40 ? 'Amazing!' : 'Unicorn legend!';
    $('runStars').textContent = runStars ? `You caught ${runStars} ⭐` : 'Fly through the ⭐ to catch them!';

    const newly = SKINS.filter((s) => s.need > starsBefore && s.need <= store.stars);
    const next = SKINS.find((s) => s.need > store.stars);
    const um = $('unlockMsg');
    um.classList.toggle('yay', newly.length > 0);
    um.textContent = newly.length ? `🎉 You unlocked ${newly[newly.length - 1].name}!` :
      next ? `${next.need - store.stars} more ⭐ to unlock ${next.name}` : 'You unlocked every unicorn! 🌈';

    const over = $('over');
    over.classList.remove('armed');
    show('over');
    if (isBest || newly.length) { sfx.fanfare(); confetti(isBest ? 80 : 50); }
    // Short pause before buttons work so frantic tapping doesn't skip the score
    armAt = clock + 0.6;
  }
  let armAt = Infinity;

  // ================= Drawing =================
  const SKY = [
    ['#5ab8ff', '#c9f1ff'],   // day
    ['#8e7cff', '#ffb38a'],   // sunset
    ['#0b1846', '#3b2a7a'],   // night
    ['#ff9ecd', '#ffe7a8'],   // dawn
  ];
  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = (pa >> 16) + (((pb >> 16) - (pa >> 16)) * t);
    const g = ((pa >> 8) & 255) + ((((pb >> 8) & 255) - ((pa >> 8) & 255)) * t);
    const bl = (pa & 255) + (((pb & 255) - (pa & 255)) * t);
    return `rgb(${r | 0},${g | 0},${bl | 0})`;
  }
  const NIGHT_STARS = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * 0.75, s: 0.6 + Math.random() * 1.6, p: Math.random() * 6 }));
  const CLOUDS = Array.from({ length: 7 }, (_, i) => ({ x: i * 260 + Math.random() * 120, y: 50 + Math.random() * 220, s: 0.6 + Math.random() * 0.8 }));
  const FLOWERS = Array.from({ length: 24 }, (_, i) => ({ x: i * 55 + Math.random() * 30, c: RAINBOW[i % 6], y: 14 + Math.random() * 40 }));

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    let sx = 0, sy = 0;
    if (shake > 0) { sx = (Math.random() - 0.5) * 14 * shake / 0.3; sy = (Math.random() - 0.5) * 14 * shake / 0.3; }
    const k = dpr * scale;
    ctx.setTransform(k, 0, 0, k, sx * k, sy * k);

    const ph = ((skyPhase % 4) + 4) % 4, i0 = Math.floor(ph), f = ph - i0, i1 = (i0 + 1) % 4;
    const ease = f * f * (3 - 2 * f);
    const night = Math.max(0, 1 - Math.abs(ph - 2));

    // Sky
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, mix(SKY[i0][0], SKY[i1][0], ease));
    g.addColorStop(1, mix(SKY[i0][1], SKY[i1][1], ease));
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, VH + 40);

    // Twinkly stars + moon at night, sun by day
    if (night > 0.02) {
      ctx.fillStyle = '#fff';
      for (const s of NIGHT_STARS) {
        ctx.globalAlpha = night * (0.5 + 0.5 * Math.sin(clock * 2 + s.p));
        ctx.beginPath(); ctx.arc(s.x * W, s.y * GROUND, s.s, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = night;
      ctx.fillStyle = '#fff7d6';
      ctx.beginPath(); ctx.arc(W * 0.78, 110, 34, 0, 7); ctx.fill();
      ctx.fillStyle = mix(SKY[2][0], SKY[2][1], 0.3);
      ctx.beginPath(); ctx.arc(W * 0.78 + 14, 100, 30, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    const day = 1 - night;
    if (day > 0.05) {
      ctx.globalAlpha = day;
      const sunY = 110 + (ph > 0.5 && ph < 2 ? (ph - 0.5) * 120 : 0);
      ctx.fillStyle = 'rgba(255, 255, 255, .3)';
      ctx.beginPath(); ctx.arc(W * 0.8, sunY, 58 + Math.sin(clock * 2) * 4, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffe873';
      ctx.beginPath(); ctx.arc(W * 0.8, sunY, 38, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Far mountains + near hills (parallax)
    hills(dist * 0.12, 380, 70, '#b9a7ff', 0.006, 0.013);
    hills(dist * 0.3, 450, 40, '#8fdc8a', 0.009, 0.021);

    // Decorative clouds
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (const c of CLOUDS) {
      const span = Math.max(W + 300, 1820);
      const x = (((c.x - dist * 0.45) % span) + span) % span - 150;
      cloud(x, c.y, c.s);
    }

    // Night tint for the scenery (unicorn + stars stay bright)
    if (night > 0.02) { ctx.fillStyle = `rgba(15, 8, 60, ${night * 0.3})`; ctx.fillRect(-20, -20, W + 40, VH + 40); }

    for (const p of pillars) drawPillar(p, night);
    ground(night);
    for (const s of stars) drawStar(s);
    drawTrail();
    drawUnicorn(uni.x, uni.y, uni.rot, uni.wing, skin, state === 'dying' || state === 'over');
    drawParticles();
    hud();

    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.6})`; ctx.fillRect(-20, -20, W + 40, VH + 40); }
  }

  function hills(off, base, amp, color, f1, f2) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-10, GROUND + 10);
    for (let x = -10; x <= W + 20; x += 14) {
      const wx = x + off;
      ctx.lineTo(x, base - amp * (0.6 * Math.sin(wx * f1) + 0.4 * Math.sin(wx * f2 + 1.3)));
    }
    ctx.lineTo(W + 20, GROUND + 10);
    ctx.fill();
  }

  function cloud(x, y, s) {
    ctx.beginPath();
    ctx.arc(x, y, 26 * s, 0, 7);
    ctx.arc(x + 28 * s, y - 14 * s, 32 * s, 0, 7);
    ctx.arc(x + 60 * s, y, 26 * s, 0, 7);
    ctx.arc(x + 30 * s, y + 8 * s, 26 * s, 0, 7);
    ctx.fill();
  }

  function drawPillar(p, night) {
    const top = p.gapY - p.gap / 2, bot = p.gapY + p.gap / 2;
    const body = night > 0.5 ? '#e4dcff' : '#ffffff';
    const edge = night > 0.5 ? '#b3a4ef' : '#cfe0ff';
    for (const [y0, y1, capY, dir] of [[-40, top, top, 1], [bot, GROUND + 4, bot, -1]]) {
      // Column
      ctx.fillStyle = body;
      roundRect(p.x + 6, y0, PILLAR_W - 12, y1 - y0, 14);
      ctx.fill();
      ctx.fillStyle = edge;
      ctx.fillRect(p.x + PILLAR_W - 22, y0 + 8, 10, Math.max(0, y1 - y0 - 16));
      // Rainbow band near the cap
      const bandY = capY - dir * 30;
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = RAINBOW[(p.hue + i) % 6];
        ctx.fillRect(p.x + 6, bandY - dir * i * 6 - 3, PILLAR_W - 12, 6);
      }
      // Puffy cloud cap
      ctx.fillStyle = body;
      ctx.beginPath();
      const cy = capY - dir * 10;
      ctx.arc(p.x + 12, cy, 15, 0, 7);
      ctx.arc(p.x + PILLAR_W / 2, cy + dir * 2, 18, 0, 7);
      ctx.arc(p.x + PILLAR_W - 12, cy, 15, 0, 7);
      ctx.fill();
      ctx.fillStyle = edge;
      ctx.beginPath();
      ctx.arc(p.x + PILLAR_W - 14, cy + dir * 4, 8, 0, 7);
      ctx.fill();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, Math.max(0, h), r); return; }
    ctx.rect(x, y, w, Math.max(0, h));
  }

  function ground(night) {
    ctx.fillStyle = night > 0.5 ? '#3f9a52' : '#6fd36a';
    ctx.fillRect(-20, GROUND, W + 40, VH - GROUND + 20);
    // Scalloped grass edge
    ctx.fillStyle = night > 0.5 ? '#54b860' : '#8ae67d';
    const off = dist % 28;
    ctx.beginPath();
    for (let x = -28 - off; x < W + 28; x += 28) { ctx.moveTo(x + 14, GROUND); ctx.arc(x + 14, GROUND, 14, Math.PI, 0); }
    ctx.fill();
    ctx.fillStyle = night > 0.5 ? '#2f7a40' : '#4fb84f';
    ctx.fillRect(-20, GROUND + 50, W + 40, VH);
    // Flowers
    const span = Math.max(W + 60, 1320);
    for (const fl of FLOWERS) {
      const x = (((fl.x - dist) % span) + span) % span - 30;
      const y = GROUND + fl.y;
      ctx.fillStyle = fl.c;
      for (let i = 0; i < 5; i++) { const a = i * 1.2566; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 4, y + Math.sin(a) * 4, 3.5, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#fff3a8';
      ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill();
    }
  }

  function starPath(x, y, r, rot = 0) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = rot - Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.48 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }

  function drawStar(s) {
    if (s.got) return;
    const bob = Math.sin(s.t * 4) * 5, r = 15 + Math.sin(s.t * 6) * 1.5;
    ctx.fillStyle = 'rgba(255, 255, 255, .45)';
    ctx.beginPath(); ctx.arc(s.x, s.y + bob, r + 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd23f';
    ctx.strokeStyle = '#ff9f1a'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    starPath(s.x, s.y + bob, r, Math.sin(s.t * 2) * 0.2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x - 4, s.y + bob - 4, 3, 0, 7); ctx.fill();
  }

  function drawTrail() {
    if (trail.length < 2) return;
    ctx.lineCap = 'round';
    ctx.lineWidth = 4.2;
    for (let c = 0; c < 6; c++) {
      ctx.strokeStyle = RAINBOW[c];
      const oy = (c - 2.5) * 4;
      for (let i = 1; i < trail.length; i++) {
        ctx.globalAlpha = (i / trail.length) * 0.9;
        ctx.beginPath();
        ctx.moveTo(trail[i - 1].x, trail[i - 1].y + oy);
        ctx.lineTo(trail[i].x, trail[i].y + oy);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawUnicorn(x, y, rot, wing, s, dizzy) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    const flapA = -0.9 * wing + 0.25;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(60, 25, 110, .55)'; ctx.lineWidth = 1.6;

    // Back wing
    wingShape(-2, -8, flapA - 0.35, s.wing, 0.8);

    // Tail (rainbow strands)
    ctx.lineWidth = 5;
    s.mane.forEach((c, i) => {
      ctx.strokeStyle = c;
      ctx.beginPath();
      ctx.moveTo(-20, -4 + i * 2);
      const sway = Math.sin(clock * 8 + i) * 4;
      ctx.quadraticCurveTo(-34, -10 + i * 4 + sway, -42, 2 + i * 5 + sway);
      ctx.stroke();
    });
    ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(60, 25, 110, .55)';

    // Legs (tucked while flying)
    const legs = [[-12, 0.5], [-5, 0.2], [8, -0.3], [14, -0.6]];
    for (const [lx, a] of legs) {
      ctx.save(); ctx.translate(lx, 9); ctx.rotate(a + Math.sin(clock * 10 + lx) * 0.15);
      ctx.fillStyle = s.shade; ctx.fillRect(-3, 0, 6, 13);
      ctx.fillStyle = s.hoof; ctx.fillRect(-3, 11, 6, 4);
      ctx.restore();
    }

    // Body
    ctx.fillStyle = s.body;
    ctx.beginPath(); ctx.ellipse(0, 0, 23, 15, 0, 0, 7); ctx.fill(); ctx.stroke();
    // Neck
    ctx.beginPath(); ctx.moveTo(10, -9); ctx.quadraticCurveTo(18, -20, 22, -24); ctx.lineTo(30, -16); ctx.quadraticCurveTo(24, -6, 20, 4); ctx.closePath(); ctx.fill();
    // Head
    ctx.beginPath(); ctx.ellipse(27, -22, 11, 9.5, -0.35, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(35, -16, 7.5, 6.5, -0.2, 0, 7); ctx.fill(); ctx.stroke();
    // Ear
    ctx.beginPath(); ctx.moveTo(20, -29); ctx.lineTo(22, -38); ctx.lineTo(26, -30); ctx.closePath(); ctx.fill(); ctx.stroke();
    // Horn
    ctx.fillStyle = s.horn;
    ctx.beginPath(); ctx.moveTo(25, -30); ctx.lineTo(36, -49); ctx.lineTo(31, -28); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(27, -33); ctx.lineTo(31, -34); ctx.moveTo(29, -38); ctx.lineTo(32.5, -39); ctx.moveTo(31, -43); ctx.lineTo(34, -44); ctx.stroke();
    // Mane
    s.mane.forEach((c, i) => {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(19 - i * 3.2, -27 + i * 3.6, 6.5, 0, 7); ctx.fill();
    });
    // Face
    if (dizzy) {
      ctx.strokeStyle = '#3b1d6e'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(26, -26); ctx.lineTo(32, -20); ctx.moveTo(32, -26); ctx.lineTo(26, -20); ctx.stroke();
    } else {
      ctx.fillStyle = '#2b1550';
      ctx.beginPath(); ctx.ellipse(29, -23, 3, 3.8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(30, -24.5, 1.3, 0, 7); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255, 120, 170, .55)';
    ctx.beginPath(); ctx.ellipse(32, -15, 3.5, 2.2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(60,25,110,.5)';
    ctx.beginPath(); ctx.arc(40, -16, 1.2, 0, 7); ctx.fill();

    // Front wing
    ctx.strokeStyle = 'rgba(60, 25, 110, .55)'; ctx.lineWidth = 1.6;
    wingShape(0, -8, flapA, s.wing, 1);
    ctx.restore();

    // Dizzy stars circling the head
    if (dizzy) {
      for (let i = 0; i < 3; i++) {
        const a = clock * 5 + i * 2.09;
        ctx.fillStyle = RAINBOW[i * 2];
        starPath(x + Math.cos(a) * 26, y - 34 + Math.sin(a) * 8, 6, a);
        ctx.fill();
      }
    }
  }

  function wingShape(x, y, a, color, alpha) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(a);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-6, -26, -26, -34);
    ctx.quadraticCurveTo(-20, -22, -28, -18);
    ctx.quadraticCurveTo(-18, -12, -24, -4);
    ctx.quadraticCurveTo(-12, -2, 0, 0);
    ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = Math.min(1, p.life / p.max * 1.5);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      if (p.kind === 'dot') { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); }
      else if (p.kind === 'star') { starPath(p.x, p.y, p.size, p.rot); ctx.fill(); }
      else if (p.kind === 'confetti') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
      } else if (p.kind === 'text') {
        outlined(p.text, p.x, p.y, p.size, p.color);
      }
    }
    ctx.globalAlpha = 1;
  }

  function outlined(text, x, y, size, fill = '#fff', align = 'center') {
    ctx.font = `700 ${size}px Fredoka, ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = size * 0.22; ctx.strokeStyle = '#5b21b6';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function hud() {
    if (state === 'play' || state === 'dying') {
      const pop = particles.some((p) => p.kind === 'text' && p.text === '+1' && p.life > p.max - 0.15) ? 1.15 : 1;
      outlined(String(score), W / 2, 62, 58 * pop);
      if (runStars) outlined(`⭐ ${runStars}`, W - 18, 38, 26, '#ffe14d', 'right');
    }
    for (const b of banners) {
      const t = b.t, s = t < 0.25 ? t / 0.25 : 1;
      ctx.globalAlpha = t > 1.4 ? (1.8 - t) / 0.4 : 1;
      ctx.save();
      ctx.translate(W / 2, 170);
      ctx.scale(0.5 + 0.5 * s + Math.sin(t * 12) * 0.03, 0.5 + 0.5 * s);
      outlined(b.text, 0, 0, Math.min(52, W / 8), '#ffe14d');
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  // ================= Loop =================
  let last = 0;
  function frame(ts) {
    const dt = last ? Math.min(0.05, Math.max(0, (ts - last) / 1000)) : 0.016;
    last = ts;
    update(dt);
    if (state === 'over' && clock >= armAt) { $('over').classList.add('armed'); armAt = Infinity; }
    draw();
    requestAnimationFrame(frame);
  }
  uni.x = unicornX();
  requestAnimationFrame(frame);

  // Tiny hook for automated tests
  window.__fotu = { get state() { return state; }, get score() { return score; } };
})();
</script>
</body>
</html>
